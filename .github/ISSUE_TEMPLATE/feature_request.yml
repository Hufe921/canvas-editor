name: "\U0001F680 New feature proposal"
description: Suggest an idea for this project
labels: [':sparkles: feature request']
body:
  - type: markdown
    attributes:
      value: |
        **Before You Start...**

         This form is only for submitting feature requests. If you have a usage question
         or are unsure if this is really a bug, make sure to:

         - Read the [docs](https://github.com/HerbertHe/canvas-editor/tree/HEAD/docs)
         - Check the [upstream plugins (compatibility must be verified)](https://github.com/Hufe921/canvas-editor-plugin) — capabilities like
           Word/Excel import-export, formulas, comments, spellcheck or find & replace may already be available as a plugin

         Also try to search for your issue - another user may have already requested something similar!

         常见能力（Word/Excel 导入导出、公式、批注、拼写检查、查找替换等）可能已由上游插件提供（需验证本 fork 兼容性），提交前请先查看 [canvas-editor-plugin](https://github.com/Hufe921/canvas-editor-plugin)
  - type: textarea
    id: problem-description
    attributes:
      label: What problem does this feature solve?
      description: |
        Explain your use case, context, and rationale behind this feature request. More importantly, what is the **end user experience** you are trying to build that led to the need for this feature?
      placeholder: Problem description
    validations:
      required: true
  - type: textarea
    id: proposed-API
    attributes:
      label: What does the proposed API look like?
      description: |
        Describe how you propose to solve the problem and provide code samples of how the API would work once implemented. Note that you can use [Markdown](https://guides.github.com/features/mastering-markdown/) to format your code blocks.
      placeholder: Steps to reproduce
    validations:
      required: true

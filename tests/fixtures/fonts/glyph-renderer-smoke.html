<!doctype html>
<meta charset="utf-8" />
<title>HarfBuzz outline rendering</title>
<style>
  canvas {
    border: 1px solid #ddd;
  }
  body {
    font: 14px sans-serif;
  }
</style>
<div id="diagnostics"></div>
<script type="module">
  import { FontManager } from '../../../src/editor/core/text-engine/font/FontManager.ts'
  import { HarfBuzzTextShaper } from '../../../src/editor/core/text-engine/shape/HarfBuzzTextShaper.ts'
  import { TextLayoutEngine } from '../../../src/editor/core/text-engine/layout/TextLayoutEngine.ts'
  import { BidiResolver } from '../../../src/editor/core/text-engine/bidi/BidiResolver.ts'
  import { GlyphRenderer } from '../../../src/editor/core/text-engine/render/GlyphRenderer.ts'
  import { FontCoverageTracker } from '../../../src/editor/core/text-engine/font/FontCoverageTracker.ts'
  import { FontDiagnostics } from '../../../src/editor/core/draw/FontDiagnostics.ts'
  import { I18n } from '../../../src/editor/core/i18n/I18n.ts'
  window.glyphReady = (async () => {
    const fm = new FontManager()
    const color = new FontManager()
    let diagnostics
    try {
      await fm.init([
        { family: 'Latin', url: './NotoSans-Latin-Regular.woff2' },
        { family: 'CJK', url: './NotoSansSC-Regular.woff2' },
        {
          family: 'Arabic',
          url: '/canvas-editor/fonts/NotoNaskhArabic-Regular.ttf'
        },
        {
          family: 'Deva',
          url: '/canvas-editor/fonts/NotoSansDevanagari-Regular.ttf'
        },
        { family: 'Thai', url: '/canvas-editor/fonts/NotoSansThai-Regular.ttf' }
      ])
      const engine = new TextLayoutEngine(
        new BidiResolver(),
        new HarfBuzzTextShaper(fm)
      )
      const renderer = new GlyphRenderer(fm)
      function bounds(image) {
        let x1 = image.width,
          y1 = image.height,
          x2 = -1,
          y2 = -1
        for (let y = 0; y < image.height; y++)
          for (let x = 0; x < image.width; x++) {
            if (image.data[(y * image.width + x) * 4 + 3]) {
              x1 = Math.min(x1, x)
              y1 = Math.min(y1, y)
              x2 = Math.max(x2, x)
              y2 = Math.max(y2, y)
            }
          }
        return [x1, y1, x2, y2]
      }
      const cases = [
        ['Latin', 'office AV q\u0301'],
        ['CJK', '中文汉字'],
        ['Arabic', 'مرحبا بالعالم'],
        ['Deva', 'नमस्ते दुनिया'],
        ['Thai', 'สวัสดี'],
        ['Mixed', 'office 中文 नमस्ते สวัสดี مرحبا']
      ].map(([family, text]) => {
        const spans = Array.from(
          new Intl.Segmenter('und', { granularity: 'grapheme' }).segment(text),
          ({ segment, index }) => ({
            text: segment,
            logicalIndex: index,
            style: {
              fontFamily: family === 'Mixed' ? 'Latin' : family,
              fontSize: family === 'Mixed' && index < 6 ? 18 : 26,
              scriptShift:
                family === 'Mixed' && index < 6 ? 'super' : undefined,
              color: index % 2 ? '#cc0000' : '#0033cc'
            }
          })
        )
        const layout = engine.layoutParagraph({
          spans,
          availableWidth: family === 'Mixed' ? 160 : 300,
          direction: family === 'Arabic' ? 'rtl' : 'ltr',
          align: 'left',
          lineHeight: 40
        })
        const canvas = document.createElement('canvas'),
          reference = document.createElement('canvas')
        canvas.width = reference.width = 400
        canvas.height = reference.height = Math.max(
          100,
          layout.lines.length * 70
        )
        canvas.dataset.script = family
        const label = document.createElement('p')
        label.textContent = family
        document.body.append(label, canvas)
        const ctx = canvas.getContext('2d'),
          ref = reference.getContext('2d')
        ctx.fillText = () => {
          throw new Error('Browser text painting used')
        }
        ctx.measureText = () => {
          throw new Error('Browser metrics used')
        }
        let paints = 0
        const fill = ctx.fill.bind(ctx)
        ctx.fill = (...args) => {
          paints++
          return fill(...args)
        }
        let expectedPaints = 0
        layout.lines.forEach((line, i) => {
          const baseline = 55 + i * 70
          renderer.drawLine(
            ctx,
            line,
            25,
            baseline,
            'source text must not be used'
          )
          for (const glyph of line.glyphs) {
            if (glyph.missing) throw new Error('Fixture text not covered')
            const font = fm.getFont(glyph.style)
            if (font.ref.faceId !== glyph.font.faceId)
              throw new Error('Actual font mismatch')
            const path = font.otFont.glyphs
              .get(glyph.glyphId)
              .getPath(
                25 + glyph.left + glyph.dx,
                baseline + (glyph.baselineShift || 0) - glyph.dy,
                glyph.style.fontSize
              )
            if (!path.commands.length) continue
            expectedPaints++
            path.fill = glyph.style.color
            path.draw(ref)
          }
        })
        const actual = ctx.getImageData(0, 0, canvas.width, canvas.height)
        const expected = ref.getImageData(
          0,
          0,
          reference.width,
          reference.height
        )
        let different = 0,
          ink = 0
        for (let i = 0; i < actual.data.length; i += 4) {
          if (actual.data[i + 3] || expected.data[i + 3]) ink++
          if (
            [0, 1, 2, 3].some(
              k => Math.abs(actual.data[i + k] - expected.data[i + k]) > 25
            )
          )
            different++
        }
        return {
          family,
          paints,
          expectedPaints,
          different,
          ink,
          actualBounds: bounds(actual),
          expectedBounds: bounds(expected),
          widths: layout.lines.map(line => line.width)
        }
      })
      // A color glyph is a backend capability issue, even though its cmap exists.
      await color.init([
        { family: 'Color', url: './NotoSans-Latin-Regular.woff2' }
      ])
      const style = { fontFamily: 'Color', fontSize: 20 }
      const font = color.getFont(style)
      font.otFont.tables.colr = {
        baseGlyphRecords: [{ glyphID: font.hbFont.nominalGlyph(65) }]
      }
      const tracker = new FontCoverageTracker()
      tracker.update(
        tracker.begin(),
        [
          {
            text: 'A',
            style,
            direction: 'ltr',
            positions: [
              {
                scope: 'main',
                nodeId: 'a',
                start: 0,
                end: 1,
                textStart: 0,
                textEnd: 1
              }
            ]
          }
        ],
        color,
        false
      )
      diagnostics = new FontDiagnostics(
        document.querySelector('#diagnostics'),
        new I18n('zhCN'),
        () => ({ print: false, rtl: false })
      )
      diagnostics.update(tracker.getReport())
      return { cases, reason: tracker.getReport().issues[0].reason }
    } finally {
      fm.destroy()
      color.destroy()
    }
  })()
</script>
